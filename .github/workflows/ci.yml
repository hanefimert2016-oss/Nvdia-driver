name: AD107 bring-up CI

on:
  push:
    branches:
      - main
      - ad107-rtx4060-bringup
  pull_request:

jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j2
      - name: Test
        run: make test
      - name: Verify RTX 4060 Laptop profile
        run: ./build/ad107-identify 0x10de 0x28e0
