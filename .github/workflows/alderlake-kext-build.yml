name: Build AlderLakeGPU kext

on:
  push:
    branches:
      - alderlake-igpu-baremetal-hackintosh
    paths:
      - "alderlake/baremetal/kernel/AlderLakeGPU/**"
      - ".github/workflows/alderlake-kext-build.yml"
  workflow_dispatch:

jobs:
  build-kext:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          uname -a
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned x86_64 kext
        run: |
          chmod +x alderlake/baremetal/kernel/AlderLakeGPU/build.sh
          alderlake/baremetal/kernel/AlderLakeGPU/build.sh

      - name: Inspect bundle
        run: |
          KEXT="alderlake/baremetal/kernel/AlderLakeGPU/build/Products/Release/AlderLakeGPU.kext"
          plutil -p "$KEXT/Contents/Info.plist"
          file "$KEXT/Contents/MacOS/AlderLakeGPU"
          nm -g "$KEXT/Contents/MacOS/AlderLakeGPU" | grep _kmod_info

      - name: Package
        run: |
          cd alderlake/baremetal/kernel/AlderLakeGPU/build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent AlderLakeGPU.kext AlderLakeGPU.kext.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AlderLakeGPU-kext-x86_64
          path: alderlake/baremetal/kernel/AlderLakeGPU/build/Products/Release/AlderLakeGPU.kext.zip
          if-no-files-found: error
